plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.qingshu.app"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.qingshu.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // 固定签名：自更新要求每个版本签名一致。
    //
    // 为什么必须固定：GitHub Actions 的 Linux runner 上没有
    // ~/.android/debug.keystore，Flutter 每次构建都会现场生成一个**随机**的
    // debug keystore，于是每个版本的签名都不同 —— 应用内更新会报
    // 「签名不一致」，只能卸载重装。这不是偶发问题，是每次发包都会重现。
    //
    // 做法：仓库里带一份固定的 keystore，CI 和本地都用它签。
    // 自用项目，密钥随仓库走；真要发布到应用商店时再换成独立保管的密钥。
    // 用 projectDir 显式拼绝对路径：signingConfigs 里的 file() 解析基准
    // 在 AGP 各版本间不一致（有时是 rootProject、有时是模块目录），
    // 之前写成 file('qingshu-release.keystore') 在 CI 上就落空了 ——
    // keystore 明明在仓库里，Gradle 却读不到，静默退回 debug 签名，
    // 于是每个版本签名又不一样。这里直接钉死路径，不依赖解析规则。
    def releaseKeystore = new File(projectDir, 'qingshu-release.keystore')
    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword 'qingshu2024'
                keyAlias 'qingshu'
                keyPassword 'qingshu2024'
            }
        }
    }

    buildTypes {
        release {
            // keystore 在就用固定签名，不在就退回 debug（本地无密钥时仍能跑）。
            signingConfig releaseKeystore.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
