name: kazumi
description: "青枢 — 轻小说与番剧阅读器"
publish_to: "none"
version: 0.7.0+700

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.2.2
  cupertino_icons: ^1.0.6
  flutter_modular: ^7.1.0
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  dio: ^5.11.0
  cookie_jar: ^4.0.9
  crypto: ^3.0.6
  connectivity_plus: ^6.0.5
  # GBK / GB2312 解码。dart:convert 只有 UTF-8/Latin-1，而 wenku8 这类老站点
  # 整站是 GBK —— 不转码拿到的是乱码，书名和正文全都读不出来。
  enough_convert: ^1.7.1

  # 小说朗读。
  #
  # 两条通道：
  #   • flutter_tts —— 系统 TTS，零成本、立即能用，作为兜底与快速试听
  #   • sherpa_onnx —— 本地神经网络 TTS（VITS 中文），音质接近真人
  #
  # sherpa_onnx 的模型（约 31MB）不打包进 APK，第一次使用时下载到应用目录。
  # 这样 APK 保持 32MB 左右，而需要好声音的人也就多花一次 31MB 流量。
  flutter_tts: ^4.2.5
  sherpa_onnx: ^2.0.3

  path_provider: ^2.1.5
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  ech_http: ^0.2.4
  http: ^1.6.0
  image: ^4.8.0
  file_picker: ^10.3.7

  flutter_volume_controller: ^2.0.2
  audio_service: ^0.18.15
  audio_service_mpris:
    git:
      url: https://github.com/Predidit/audio-service-mpris.git
      ref: d30b53fb7dbdd8f10ceda7447fe0a0218711a220
  audio_service_win:
    git:
      url: https://github.com/Predidit/audio_service_win.git
      ref: 8ad650c6eb487208b9861d44755c8e58db061c88
  audio_session: ^0.2.2
  dynamic_color: ^1.9.0
  flutter_displaymode: ^0.7.0

  url_launcher: ^6.3.0
  window_manager: ^0.5.1
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.9.0

  canvas_danmaku: ^0.3.3
  webdav_client: ^1.2.2
  tray_manager: ^0.5.0
  dlna_dart: ^0.1.1
  logger: ^2.6.2
  flutter_rating_bar: ^4.0.1
  scrollview_observer: ^1.22.0
  saver_gallery: ^4.1.0
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  screen_brightness_ohos: ^2.1.2
  screen_brightness_platform_interface: ^2.1.0
  synchronized: any
  flutter_svg: ^2.2.3
  antlr4: ^4.13.2
  fl_chart: ^1.1.1
  flutter_foreground_task: ^9.0.0
  skeletonizer: ^2.1.2
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_inappwebview_ios: ^1.1.2
  flutter_inappwebview_macos: ^1.1.2
  flutter_inappwebview_android: ^1.1.3
  upgrader: ^12.3.0
  open_filex: ^4.7.0
  html: any
  material_color_utilities: any
  material_new_shapes: ^1.0.0
  path: any
  photo_view: ^0.15.0
  win32: ^5.15.0
  ffi: ^2.1.0
  image_picker: ^1.2.1
  webview_windows:
    git:
      url: https://github.com/Predidit/flutter-webview-windows.git
      ref: 2b3306d2bfb9f22cbb328743b60e547cf50f0c3c
  desktop_webview_window:
    git:
      url: https://github.com/Predidit/linux_webview_window.git
      ref: 8b0d1a625795f2ec679f844349e11f77249f41b0
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: cd75bcfe94ba45ebb6f6b940c68e072d079aee14
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: cd75bcfe94ba45ebb6f6b940c68e072d079aee14
      path: ./media_kit_video
  macos_secure_bookmarks: ^0.2.1

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.5
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  msix: ^3.16.12

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  # 青枢的图标是「小鲸鱼」形象（蓝发女仆装）。
  # Android 走自适应图标：前景只放角色（已缩到 56% 安全区），背景是独立的
  # 径向渐变图层 —— 系统会按各家桌面的裁切形状自己组合，不会把角色脸裁掉。
  image_path: assets/images/logo/logo_android.png
  image_path_android: assets/images/logo/logo_android.png
  image_path_ios: assets/images/logo/logo_ios.png
  adaptive_icon_background: assets/images/logo/logo_android_background.png
  adaptive_icon_foreground: assets/images/logo/logo_android_foreground.png
  # 单色图标（Android 13+ 主题图标）用前景即可，系统会自己上色。
  adaptive_icon_monochrome: assets/images/logo/logo_android_foreground.png
  macos:
    generate: true
    image_path: assets/images/logo/logo_rounded.png
  windows:
    generate: true
    image_path: assets/images/logo/logo_rounded.png
    icon_size: 256

flutter_native_splash:
  android: false
  ios: true
  web: false
  color_ios: "#ffffff"
  color_dark_ios: "#212121"
  image_ios: assets/images/logo/logo_ios.png
  image_dark_ios: assets/images/logo/logo_ios.png

msix_config:
  display_name: 青枢
  publisher: CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US
  logo_path: assets/images/logo/logo_rounded.png
  sign_msix: false
  install_certificate: false
  build_windows: false
  protocol_activation: qingshu

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/shaders/
    # 内置小说规则（KazumiRules 官方仓库没有 novel 类型，这里补上）
    - assets/rules/novel/
    # 离线语音模型（sherpa-onnx VITS 中文，31MB）。
    # 自用版本直接打进包：不用下载、不受网络影响。APK 会因此涨到 ~72MB。
    - assets/tts/xiao_ya/
    - assets/tts/chaowen/
    - assets/images/logo/
    - assets/statements/
    - licenses/ech_http/
  fonts:
    - family: MI_Sans_Regular
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
